<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Journal">
  <meta name="theme-color" content="#ffffff">
  <title>Journal</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f7f7;
      --border: #ebebeb;
      --text: #0a0a0a;
      --sub: #999;
      --accent: #007aff;
      --red: #ff3b30;
      --dot: #34c759;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    #app {
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .safe-top { height: max(env(safe-area-inset-top), 48px); flex-shrink: 0; }
    .safe-bot { height: max(env(safe-area-inset-bottom), 16px); flex-shrink: 0; }

    /* ── VIEWS ── */
    .view { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .view.active { display: flex; }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px 12px;
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header .month-nav {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
    }
    .nav-btn:active { background: var(--surface); }

    .month-label {
      font-size: 17px;
      font-weight: 600;
      min-width: 140px;
      text-align: center;
    }

    /* ── CALENDAR ── */
    .calendar-wrap { flex: 1; overflow-y: auto; padding: 0 16px; }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      margin-bottom: 8px;
    }

    .weekdays span {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--sub);
      padding: 4px 0;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cal-day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      cursor: pointer;
      position: relative;
      transition: background 0.1s;
      gap: 3px;
    }
    .cal-day:active { background: var(--surface); }

    .cal-day.empty { pointer-events: none; }

    .cal-day.today .day-num {
      background: var(--accent);
      color: #fff;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .day-num {
      font-size: 15px;
      font-weight: 500;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .has-entry .day-num { font-weight: 700; }

    .entry-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--dot);
      position: absolute;
      bottom: 6px;
    }

    /* ── DAY DETAIL VIEW ── */
    #view-day .header { padding-bottom: 8px; }
    #view-day .back-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 0;
    }

    .day-title {
      font-size: 22px;
      font-weight: 700;
      padding: 0 20px 16px;
      flex-shrink: 0;
    }

    .entries-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .entry-card {
      background: var(--surface);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .entry-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .entry-time {
      font-size: 12px;
      color: var(--sub);
      font-weight: 500;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--red);
      font-size: 13px;
      cursor: pointer;
      padding: 2px 6px;
    }

    /* ── AUDIO PLAYER ── */
    .audio-player {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .play-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: none;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .play-btn:active { opacity: 0.7; }

    .progress-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .progress-bar {
      width: 100%;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      width: 0%;
      transition: width 0.1s linear;
    }

    .duration-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--sub);
    }

    .empty-day {
      text-align: center;
      color: var(--sub);
      font-size: 15px;
      padding: 40px 20px;
    }

    /* ── RECORD BUTTON ── */
    .rec-bar {
      padding: 12px 20px;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
    }

    .rec-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 4px solid var(--border);
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s;
      position: relative;
    }

    .rec-inner {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--red);
      transition: border-radius 0.15s, transform 0.15s;
    }

    .rec-btn.recording { border-color: var(--red); }
    .rec-btn.recording .rec-inner {
      border-radius: 8px;
      transform: scale(0.75);
    }

    .rec-timer-label {
      position: absolute;
      bottom: -20px;
      font-size: 11px;
      color: var(--red);
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .rec-hint {
      font-size: 12px;
      color: var(--sub);
      text-align: center;
      margin-top: 28px;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
<div id="app">
  <div class="safe-top"></div>

  <!-- CALENDAR VIEW -->
  <div class="view active" id="view-cal">
    <div class="header">
      <h1>Journal</h1>
      <div class="month-nav">
        <button class="nav-btn" id="prev-month">‹</button>
        <span class="month-label" id="month-label"></span>
        <button class="nav-btn" id="next-month">›</button>
      </div>
    </div>
    <div class="calendar-wrap">
      <div class="weekdays">
        <span>Sun</span><span>Mon</span><span>Tue</span>
        <span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
    <div class="safe-bot"></div>
  </div>

  <!-- DAY DETAIL VIEW -->
  <div class="view" id="view-day">
    <div class="header">
      <button class="back-btn" id="back-btn">‹ Journal</button>
    </div>
    <div class="day-title" id="day-title"></div>
    <div class="entries-list" id="entries-list"></div>
    <div class="rec-bar">
      <div style="display:flex;flex-direction:column;align-items:center">
        <button class="rec-btn" id="rec-btn">
          <div class="rec-inner"></div>
        </button>
        <div class="rec-hint">Tap to record</div>
      </div>
    </div>
    <div class="safe-bot"></div>
  </div>
</div>

<script>
// ── Storage helpers ──────────────────────────────────────────────────────────
const DB_KEY = 'audio_journal_v1';

function loadEntries() {
  try { return JSON.parse(localStorage.getItem(DB_KEY)) || {}; }
  catch { return {}; }
}

function saveEntries(data) {
  localStorage.setItem(DB_KEY, JSON.stringify(data));
}

function dateKey(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function todayKey() {
  const n = new Date();
  return dateKey(n.getFullYear(), n.getMonth(), n.getDate());
}

// ── State ────────────────────────────────────────────────────────────────────
let curYear = new Date().getFullYear();
let curMonth = new Date().getMonth();
let activeDayKey = null;
let entries = loadEntries(); // { "2025-03-24": [{id, blob_url, ts, dur},...] }
let mediaRecorder = null;
let recChunks = [];
let recInterval = null;
let recSec = 0;
let activeAudio = null; // currently playing HTMLAudio

// ── Calendar ─────────────────────────────────────────────────────────────────
const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];

function renderCalendar() {
  document.getElementById('month-label').textContent = `${MONTHS[curMonth]} ${curYear}`;
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  const today = new Date();
  const firstDay = new Date(curYear, curMonth, 1).getDay();
  const daysInMonth = new Date(curYear, curMonth+1, 0).getDate();

  // empty cells before first day
  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement('div');
    el.className = 'cal-day empty';
    grid.appendChild(el);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const key = dateKey(curYear, curMonth, d);
    const el = document.createElement('div');
    el.className = 'cal-day';

    const isToday = d === today.getDate() && curMonth === today.getMonth() && curYear === today.getFullYear();
    if (isToday) el.classList.add('today');

    const numEl = document.createElement('div');
    numEl.className = 'day-num';
    numEl.textContent = d;
    el.appendChild(numEl);

    if (entries[key] && entries[key].length > 0) {
      el.classList.add('has-entry');
      const dot = document.createElement('div');
      dot.className = 'entry-dot';
      el.appendChild(dot);
    }

    el.addEventListener('click', () => openDay(key, d));
    grid.appendChild(el);
  }
}

document.getElementById('prev-month').addEventListener('click', () => {
  curMonth--; if (curMonth < 0) { curMonth = 11; curYear--; }
  renderCalendar();
});
document.getElementById('next-month').addEventListener('click', () => {
  curMonth++; if (curMonth > 11) { curMonth = 0; curYear++; }
  renderCalendar();
});

// ── Day detail ───────────────────────────────────────────────────────────────
function openDay(key, dayNum) {
  activeDayKey = key;
  const [y, m, d] = key.split('-');
  const dateObj = new Date(parseInt(y), parseInt(m)-1, parseInt(d));
  const label = dateObj.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'});
  document.getElementById('day-title').textContent = label;
  renderEntries();
  showView('view-day');
}

function renderEntries() {
  const list = document.getElementById('entries-list');
  list.innerHTML = '';
  const dayEntries = entries[activeDayKey] || [];

  if (dayEntries.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-day';
    empty.textContent = 'No recordings yet.\nTap the button below to add one.';
    list.appendChild(empty);
    return;
  }

  dayEntries.forEach((entry, idx) => {
    const card = document.createElement('div');
    card.className = 'entry-card';

    const meta = document.createElement('div');
    meta.className = 'entry-meta';

    const timeEl = document.createElement('span');
    timeEl.className = 'entry-time';
    const d = new Date(entry.ts);
    timeEl.textContent = d.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
    meta.appendChild(timeEl);

    const delBtn = document.createElement('button');
    delBtn.className = 'delete-btn';
    delBtn.textContent = 'Delete';
    delBtn.addEventListener('click', () => deleteEntry(idx));
    meta.appendChild(delBtn);

    card.appendChild(meta);
    card.appendChild(buildPlayer(entry));
    list.appendChild(card);
  });
}

function buildPlayer(entry) {
  const wrap = document.createElement('div');
  wrap.className = 'audio-player';

  const audio = new Audio(entry.url);
  let playing = false;

  const playBtn = document.createElement('button');
  playBtn.className = 'play-btn';
  playBtn.innerHTML = '▶';

  const progressWrap = document.createElement('div');
  progressWrap.className = 'progress-wrap';

  const bar = document.createElement('div');
  bar.className = 'progress-bar';
  const fill = document.createElement('div');
  fill.className = 'progress-fill';
  bar.appendChild(fill);

  const durRow = document.createElement('div');
  durRow.className = 'duration-row';
  const curTime = document.createElement('span');
  curTime.textContent = '0:00';
  const totTime = document.createElement('span');
  totTime.textContent = fmtTime(entry.dur || 0);
  durRow.appendChild(curTime);
  durRow.appendChild(totTime);

  progressWrap.appendChild(bar);
  progressWrap.appendChild(durRow);
  wrap.appendChild(playBtn);
  wrap.appendChild(progressWrap);

  playBtn.addEventListener('click', () => {
    if (activeAudio && activeAudio !== audio) {
      activeAudio.pause();
      activeAudio.dispatchEvent(new Event('stopped'));
    }
    if (playing) {
      audio.pause();
    } else {
      audio.play();
      activeAudio = audio;
    }
  });

  audio.addEventListener('play', () => { playing = true; playBtn.innerHTML = '⏸'; });
  audio.addEventListener('pause', () => { playing = false; playBtn.innerHTML = '▶'; });
  audio.addEventListener('stopped', () => { playing = false; playBtn.innerHTML = '▶'; });
  audio.addEventListener('ended', () => { playing = false; playBtn.innerHTML = '▶'; fill.style.width = '0%'; curTime.textContent = '0:00'; });

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    fill.style.width = pct + '%';
    curTime.textContent = fmtTime(audio.currentTime);
  });

  bar.addEventListener('click', (e) => {
    if (!audio.duration) return;
    const rect = bar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    audio.currentTime = pct * audio.duration;
  });

  return wrap;
}

function deleteEntry(idx) {
  if (!confirm('Delete this recording?')) return;
  entries[activeDayKey].splice(idx, 1);
  if (entries[activeDayKey].length === 0) delete entries[activeDayKey];
  saveEntries(entries);
  renderEntries();
  renderCalendar();
}

function fmtTime(s) {
  s = Math.floor(s);
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

// ── Recording ─────────────────────────────────────────────────────────────────
const recBtn = document.getElementById('rec-btn');

recBtn.addEventListener('click', async () => {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    stopRecording();
  } else {
    await startRecording();
  }
});

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => recChunks.push(e.data);
    mediaRecorder.onstop = saveRecording;
    mediaRecorder.start();
    recBtn.classList.add('recording');
    recSec = 0;
    updateRecTimer();
    recInterval = setInterval(() => { recSec++; updateRecTimer(); }, 1000);
  } catch(e) {
    alert('Microphone access denied. Please allow microphone in Settings.');
  }
}

function stopRecording() {
  if (mediaRecorder) {
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach(t => t.stop());
  }
  clearInterval(recInterval);
  recBtn.classList.remove('recording');
  removeRecTimer();
}

function updateRecTimer() {
  let label = recBtn.querySelector('.rec-timer-label');
  if (!label) {
    label = document.createElement('span');
    label.className = 'rec-timer-label';
    recBtn.appendChild(label);
  }
  label.textContent = fmtTime(recSec);
}

function removeRecTimer() {
  const label = recBtn.querySelector('.rec-timer-label');
  if (label) label.remove();
}

function saveRecording() {
  const blob = new Blob(recChunks, { type: 'audio/webm' });
  const url = URL.createObjectURL(blob);
  const entry = { id: Date.now(), url, ts: Date.now(), dur: recSec };

  if (!entries[activeDayKey]) entries[activeDayKey] = [];
  entries[activeDayKey].push(entry);
  saveEntries(entries);
  renderEntries();
  renderCalendar();
}

// ── Navigation ───────────────────────────────────────────────────────────────
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

document.getElementById('back-btn').addEventListener('click', () => {
  if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
  if (activeAudio) { activeAudio.pause(); activeAudio = null; }
  showView('view-cal');
});

// ── Init ─────────────────────────────────────────────────────────────────────
renderCalendar();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Journal">
  <meta name="theme-color" content="#080c1e">
  <link rel="manifest" href="manifest.json">
  <title>Journal</title>
  <style>
    :root {
      --bg:      #080c1e;
      --bg2:     #0c1230;
      --surface: rgba(255,255,255,0.05);
      --border:  rgba(255,255,255,0.08);
      --text:    rgba(255,255,255,0.88);
      --sub:     rgba(255,255,255,0.32);
      --accent:  #a8c8ff;
      --glow:    rgba(120,160,255,0.18);
      --red:     #ff6b6b;
      --tab-h:   58px;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body {
      height:100%; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;
      -webkit-font-smoothing:antialiased; overflow:hidden; user-select:none;
    }
    #app { height:100dvh; display:flex; flex-direction:column; }
    .safe-top { height:max(env(safe-area-inset-top),44px); flex-shrink:0; }
    .safe-bot  { height:max(env(safe-area-inset-bottom),6px); flex-shrink:0; }
    .screen { display:none; flex:1; flex-direction:column; overflow:hidden; min-height:0; }
    .screen.active { display:flex; }

    /* ═══ TAB BAR ═══ */
    .tab-bar {
      height:var(--tab-h); display:flex;
      border-top:1px solid var(--border); flex-shrink:0;
      background:rgba(10,26,15,0.92);
      backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    }
    .tab {
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:3px;
      background:none; border:none; cursor:pointer;
      color:var(--sub); font-size:9px; font-weight:500; letter-spacing:0.4px;
      transition:color 0.2s;
    }
    .tab.active { color:var(--accent); }
    .tab svg { width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }

    /* ═══════════════════════════════════════════
       RECORD SCREEN
    ═══════════════════════════════════════════ */
    #screen-record {
      position:relative; align-items:center; justify-content:space-between;
      padding:8px 0 20px; overflow:hidden;
    }

    .rec-top {
      text-align:center; z-index:2;
      display:flex; flex-direction:column; align-items:center; gap:2px;
      padding:0 20px;
    }
    .rec-date-label { font-size:11px; color:var(--sub); letter-spacing:0.5px; }
    .rec-timer {
      font-size:48px; font-weight:100; letter-spacing:-2px;
      font-variant-numeric:tabular-nums; color:var(--text); line-height:1;
      opacity:0; transition:opacity 0.5s;
    }
    .rec-timer.visible { opacity:1; }

    /* ── ORB (hold to record) ── */
    .orb-area {
      flex:1; display:flex; align-items:center; justify-content:center;
      z-index:1; position:relative; width:100%;
    }

    .orb-wrap {
      position:relative; width:320px; height:320px;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; -webkit-touch-callout:none;
      touch-action:none;
    }

    /* Blobs — always moving */
    .blob {
      position:absolute; border-radius:50%; filter:blur(38px);
      will-change:transform;
    }
    .b1 {
      width:200px; height:200px;
      background:radial-gradient(circle, rgba(80,120,255,0.80) 0%, rgba(50,80,220,0.40) 60%, transparent 80%);
      animation: move1 13s ease-in-out infinite;
    }
    .b2 {
      width:175px; height:175px;
      background:radial-gradient(circle, rgba(160,80,255,0.65) 0%, rgba(120,50,200,0.30) 60%, transparent 80%);
      animation: move2 17s ease-in-out infinite;
    }
    .b3 {
      width:155px; height:155px;
      background:radial-gradient(circle, rgba(40,180,255,0.55) 0%, rgba(20,130,220,0.25) 60%, transparent 80%);
      animation: move3 11s ease-in-out infinite;
    }
    .b4 {
      width:130px; height:130px;
      background:radial-gradient(circle, rgba(200,160,255,0.50) 0%, transparent 70%);
      animation: move4 15s ease-in-out infinite;
    }

    @keyframes move1 {
      0%   { transform:translate(-35px,-40px) scale(1.00); }
      25%  { transform:translate( 25px,-15px) scale(1.15); }
      50%  { transform:translate( 30px, 35px) scale(0.92); }
      75%  { transform:translate(-20px, 25px) scale(1.08); }
      100% { transform:translate(-35px,-40px) scale(1.00); }
    }
    @keyframes move2 {
      0%   { transform:translate( 30px, 30px) scale(0.95); }
      33%  { transform:translate(-30px, 10px) scale(1.10); }
      66%  { transform:translate( 10px,-35px) scale(0.88); }
      100% { transform:translate( 30px, 30px) scale(0.95); }
    }
    @keyframes move3 {
      0%   { transform:translate(-15px, 35px) scale(1.05); }
      40%  { transform:translate( 35px,-20px) scale(0.90); }
      70%  { transform:translate(-25px,-30px) scale(1.12); }
      100% { transform:translate(-15px, 35px) scale(1.05); }
    }
    @keyframes move4 {
      0%   { transform:translate( 20px,-35px) scale(1.00); }
      50%  { transform:translate(-30px, 25px) scale(1.20); }
      100% { transform:translate( 20px,-35px) scale(1.00); }
    }

    /* When recording: blobs speed up + glow intensifies */
    .orb-wrap.held .b1 { animation-duration:6s; filter:blur(32px); }
    .orb-wrap.held .b2 { animation-duration:8s; filter:blur(28px); }
    .orb-wrap.held .b3 { animation-duration:5s; filter:blur(24px); }
    .orb-wrap.held .b4 { animation-duration:7s; filter:blur(20px); }

    /* Arc progress ring */
    .orb-svg {
      position:absolute; inset:0; width:100%; height:100%;
      transform:rotate(-90deg); pointer-events:none;
    }
    .arc-track { fill:none; stroke:rgba(255,255,255,0.06); stroke-width:1.5; }
    .arc-fill  {
      fill:none; stroke:rgba(160,200,255,0.7); stroke-width:1.5;
      stroke-linecap:round;
      stroke-dasharray:942; /* 2π×150 */
      stroke-dashoffset:942;
      transition:stroke-dashoffset 0.25s linear;
    }

    /* Center label (the "speak bubble") */
    .orb-label {
      position:relative; z-index:2; pointer-events:none;
      display:flex; flex-direction:column; align-items:center; gap:6px;
    }
    .orb-label-text {
      font-size:16px; font-weight:300; letter-spacing:1px;
      color:rgba(255,255,255,0.75);
    }
    .orb-label-sub {
      font-size:10px; font-weight:500; letter-spacing:1.5px;
      text-transform:uppercase; color:rgba(255,255,255,0.28);
    }

    /* ═══════════════════════════════════════════
       CLIPS SCREEN
    ═══════════════════════════════════════════ */
    #screen-clips { overflow:hidden; }

    .screen-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 20px 10px; flex-shrink:0;
    }
    .screen-title { font-size:24px; font-weight:600; letter-spacing:-0.4px; }
    .screen-count { font-size:12px; color:var(--sub); }

    .clips-scroll { flex:1; overflow-y:auto; padding:4px 0; }

    .clip-card {
      margin:0 14px 10px; padding:14px 16px;
      background:var(--surface); border:1px solid var(--border);
      border-radius:16px;
      display:flex; flex-direction:column; gap:10px;
    }

    .clip-card-top {
      display:flex; align-items:flex-start; justify-content:space-between;
      gap:10px;
    }

    .clip-meta { flex:1; display:flex; flex-direction:column; gap:3px; }
    .clip-when { font-size:13px; font-weight:500; }
    .clip-where {
      font-size:11px; color:var(--sub);
      display:flex; align-items:center; gap:4px;
    }
    .clip-where-dot {
      width:5px; height:5px; border-radius:50%;
      background:var(--accent); flex-shrink:0;
    }

    .clip-vibe {
      display:inline-block;
      font-size:10px; font-weight:500; letter-spacing:0.6px;
      color:var(--accent); background:rgba(120,160,255,0.08);
      border:1px solid rgba(120,160,255,0.20);
      border-radius:20px; padding:3px 9px;
    }

    .clip-del-btn {
      background:none; border:none; color:var(--sub);
      font-size:18px; cursor:pointer; padding:0 4px; line-height:1;
    }
    .clip-del-btn:active { color:var(--red); }

    /* mini player */
    .mini-player { display:flex; align-items:center; gap:10px; }
    .mini-play {
      width:30px; height:30px; border-radius:50%;
      border:1px solid var(--border); background:var(--surface);
      color:var(--text); font-size:10px; cursor:pointer;
      display:flex; align-items:center; justify-content:center; flex-shrink:0;
    }
    .mini-play:active { background:rgba(255,255,255,0.1); }
    .mini-prog-wrap { flex:1; display:flex; flex-direction:column; gap:5px; }
    .mini-prog-bar  { width:100%; height:2px; background:var(--border); border-radius:2px; cursor:pointer; }
    .mini-prog-fill { height:100%; background:rgba(255,255,255,0.5); border-radius:2px; width:0%; pointer-events:none; }
    .mini-dur { font-size:10px; color:var(--sub); }

    /* ═══════════════════════════════════════════
       JOURNAL SCREEN (Calendar)
    ═══════════════════════════════════════════ */
    #screen-journal { overflow:hidden; }

    .j-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 20px 8px; flex-shrink:0;
    }
    .j-title { font-size:24px; font-weight:600; letter-spacing:-0.4px; }
    .month-nav { display:flex; align-items:center; gap:0; }
    .mnav-btn {
      background:none; border:none; color:var(--sub);
      font-size:20px; padding:4px 10px; cursor:pointer; border-radius:8px;
    }
    .mnav-btn:active { color:var(--text); }
    .mnav-label { font-size:12px; font-weight:600; color:var(--sub); min-width:100px; text-align:center; letter-spacing:0.3px; }

    .cal-scroll { flex:1; overflow-y:auto; padding:4px 12px 16px; }

    .cal-month-block { margin-bottom:22px; }
    .cal-month-label { font-size:11px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--sub); padding:8px 2px 5px; }
    .weekdays { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; margin-bottom:3px; }
    .weekdays span { font-size:9px; font-weight:700; color:var(--sub); padding:2px 0; letter-spacing:0.5px; text-transform:uppercase; }
    .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }

    .cal-day {
      aspect-ratio:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      border-radius:12px; cursor:pointer; position:relative;
      transition:background 0.15s, transform 0.1s;
    }
    .cal-day:active { transform:scale(0.92); }
    .cal-day.empty  { pointer-events:none; }

    /* days with entries get a glow */
    .cal-day.has-entry {
      background: rgba(120,160,255,0.07);
      border:1px solid rgba(120,160,255,0.16);
    }
    .cal-day.has-entry:active { background:rgba(120,160,255,0.14); }

    .day-num {
      font-size:15px; font-weight:400; color:var(--text);
      width:32px; height:32px;
      display:flex; align-items:center; justify-content:center;
      border-radius:50%;
    }
    .cal-day.today .day-num {
      background:rgba(120,160,255,0.20);
      color:var(--accent); font-weight:700;
      box-shadow:0 0 14px rgba(120,160,255,0.25);
    }
    .cal-day.has-entry .day-num { font-weight:600; color:rgba(255,255,255,0.95); }

    .entry-dot {
      width:4px; height:4px; border-radius:50%;
      background:var(--accent); position:absolute; bottom:5px;
      box-shadow:0 0 6px rgba(120,160,255,0.7);
    }

    /* ═══════════════════════════════════════════
       DAY DETAIL (not a tab)
    ═══════════════════════════════════════════ */
    #screen-day { overflow:hidden; }
    .back-row { padding:10px 18px 4px; flex-shrink:0; }
    .back-btn {
      background:none; border:none; color:var(--sub);
      font-size:14px; cursor:pointer; padding:4px 0;
    }
    .day-header { padding:2px 20px 14px; flex-shrink:0; }
    .day-heading { font-size:22px; font-weight:600; letter-spacing:-0.3px; }
    .day-sub { font-size:12px; color:var(--sub); margin-top:3px; }
    .day-scroll { flex:1; overflow-y:auto; padding:0 14px; }

    /* day stitch card (inside day detail) */
    .stitch-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:18px; padding:16px 16px 12px; margin-bottom:16px;
    }
    .stitch-label { font-size:10px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--sub); margin-bottom:12px; }
    .stitch-player { display:flex; align-items:center; gap:12px; }
    .big-play-btn {
      width:42px; height:42px; border-radius:50%;
      border:1px solid var(--border); background:var(--surface);
      color:var(--text); font-size:14px; cursor:pointer;
      display:flex; align-items:center; justify-content:center; flex-shrink:0;
    }
    .big-play-btn:active  { background:rgba(255,255,255,0.1); }
    .big-play-btn:disabled { opacity:0.3; }
    .progress-col { flex:1; display:flex; flex-direction:column; gap:6px; }
    .prog-bar  { width:100%; height:2px; background:var(--border); border-radius:2px; cursor:pointer; }
    .prog-fill { height:100%; background:rgba(255,255,255,0.55); border-radius:2px; width:0%; pointer-events:none; }
    .prog-times { display:flex; justify-content:space-between; font-size:10px; color:var(--sub); }
    .stitch-status { font-size:11px; color:var(--sub); margin-top:8px; text-align:center; }

    .clips-section-label { font-size:10px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--sub); margin-bottom:8px; }
    .clip-item {
      display:flex; align-items:center; gap:12px;
      padding:10px 0; border-bottom:1px solid var(--border);
    }
    .clip-icon { font-size:14px; flex-shrink:0; }
    .clip-info { flex:1; }
    .clip-time { font-size:14px; font-weight:500; }
    .clip-dur  { font-size:11px; color:var(--sub); margin-top:1px; }
    .clip-del  { background:none; border:none; color:var(--sub); font-size:20px; cursor:pointer; padding:4px 8px; line-height:1; }
    .clip-del:active { color:var(--red); }

    .empty-state { text-align:center; color:var(--sub); font-size:14px; padding:56px 24px; line-height:1.8; }

    /* Stitch button in clips */
    .stitch-row {
      margin:0 14px 10px;
      display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    }
    .stitch-action-btn {
      background:rgba(168,200,255,0.08);
      border:1px solid rgba(168,200,255,0.22);
      color:var(--accent); font-size:13px; font-weight:600;
      padding:8px 22px; border-radius:20px; cursor:pointer;
      letter-spacing:0.3px; transition:background 0.15s;
    }
    .stitch-action-btn:active   { background:rgba(168,200,255,0.18); }
    .stitch-action-btn:disabled { opacity:0.4; cursor:default; }
    .stitch-mini-player { display:flex; align-items:center; gap:10px; }
    .stitch-mini-play {
      background:none; border:none; color:var(--text);
      font-size:13px; cursor:pointer; padding:4px 2px;
    }
    .stitch-mini-dur { font-size:12px; color:var(--sub); }

    /* Fly-to-tab particles */
    .fly-particle {
      position:fixed; border-radius:50%; pointer-events:none; z-index:9999;
      will-change:transform, opacity;
    }
    .fly-burst-ring {
      position:fixed; border-radius:50%; pointer-events:none; z-index:9998;
      border:1.5px solid var(--accent); will-change:transform, opacity;
    }

    /* 30s countdown inside orb */
    .orb-countdown { display:none; }
  </style>
</head>
<body>
<div id="app">
  <div class="safe-top"></div>

  <!-- ══ RECORD ══ -->
  <div class="screen active" id="screen-record">
    <div class="rec-top">
      <div class="rec-date-label" id="recDate"></div>
      <div class="rec-timer" id="recTimer">0:00</div>
    </div>

    <div class="orb-area">
      <div class="orb-wrap" id="orbWrap">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
        <div class="blob b3"></div>
        <div class="blob b4"></div>
        <svg class="orb-svg" viewBox="0 0 320 320">
          <circle class="arc-track" cx="160" cy="160" r="150"/>
          <circle class="arc-fill"  cx="160" cy="160" r="150" id="arcFill"/>
        </svg>
        <div class="orb-label">
          <div class="orb-label-text" id="orbText">speak</div>
          <div class="orb-label-sub" id="orbSub">hold to record</div>
          <div class="orb-countdown" id="orbCountdown">30s</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ══ CLIPS ══ -->
  <div class="screen" id="screen-clips">
    <div class="screen-header">
      <div class="screen-title">Clips</div>
      <div class="screen-count" id="clipsCount"></div>
    </div>
    <div class="stitch-row" id="stitchRow" style="display:none">
      <button class="stitch-action-btn" id="stitchActionBtn">Stitch today</button>
      <div class="stitch-mini-player" id="stitchMiniPlayer" style="display:none">
        <button class="stitch-mini-play" id="stitchMiniPlay">▶ Play</button>
        <span class="stitch-mini-dur" id="stitchMiniDur"></span>
      </div>
    </div>
    <div class="clips-scroll" id="clipsList"></div>
  </div>

  <!-- ══ JOURNAL ══ -->
  <div class="screen" id="screen-journal">
    <div class="j-header">
      <div class="j-title">Journal</div>
      <div class="month-nav">
        <button class="mnav-btn" id="prevMonth">‹</button>
        <span class="mnav-label" id="monthLabel"></span>
        <button class="mnav-btn" id="nextMonth">›</button>
      </div>
    </div>
    <div class="cal-scroll" id="calScroll"></div>
  </div>

  <!-- ══ DAY DETAIL (not a tab) ══ -->
  <div class="screen" id="screen-day">
    <div class="back-row"><button class="back-btn" id="backBtn">← Journal</button></div>
    <div class="day-header">
      <div class="day-heading" id="dayHeading"></div>
      <div class="day-sub" id="daySub"></div>
    </div>
    <div class="day-scroll" id="dayScroll"></div>
  </div>

  <!-- ══ TAB BAR ══ -->
  <div class="tab-bar">
    <button class="tab active" id="tab-record" onclick="showTab('record')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="9"/></svg>
      Record
    </button>
    <button class="tab" id="tab-clips" onclick="showTab('clips')">
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      Clips
    </button>
    <button class="tab" id="tab-journal" onclick="showTab('journal')">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Journal
    </button>
  </div>
  <div class="safe-bot"></div>
</div>

<script>
// ═══════════════════════════════════════════════════
//  IndexedDB
// ═══════════════════════════════════════════════════
const DB_NAME = 'audio_journal', DB_VER = 1;
let db;

function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('clips')) {
        const s = d.createObjectStore('clips', { keyPath:'id', autoIncrement:true });
        s.createIndex('dateKey', 'dateKey', { unique:false });
      }
    };
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror = e => rej(e);
  });
}

const dbAdd    = c   => idbReq('readwrite', s => s.add(c));
const dbDelete = id  => idbReq('readwrite', s => s.delete(id));
const dbAll    = ()  => idbReq('readonly',  s => s.getAll());
const dbByDate = key => new Promise((res,rej) => {
  const r = db.transaction('clips','readonly').objectStore('clips').index('dateKey').getAll(key);
  r.onsuccess = e => res(e.target.result); r.onerror = rej;
});
function idbReq(mode, fn) {
  return new Promise((res, rej) => {
    const r = fn(db.transaction('clips', mode).objectStore('clips'));
    r.onsuccess = e => res(e.target.result); r.onerror = rej;
  });
}

// ═══════════════════════════════════════════════════
//  Helpers
// ═══════════════════════════════════════════════════
const fmt = s => { s = Math.floor(s||0); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
const todayKey   = () => keyFromDate(new Date());
const keyFromDate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dateKeyFor  = (y,m,d) => `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

// Vibe tag — deterministic from timestamp
const VIBES = {
  morning:   ['morning clarity','still awakening','dawn quiet','fresh presence','early light'],
  afternoon: ['noon warmth','grounded flow','open and present','midday breath','clear mind'],
  evening:   ['golden hour','soft release','day unravels','evening ease','fading light'],
  night:     ['deep quiet','midnight thought','inner stillness','night wandering','rest'],
};
function vibeFor(ts) {
  const h = new Date(ts).getHours();
  const bucket = h >= 5 && h < 12 ? VIBES.morning
               : h >= 12 && h < 17 ? VIBES.afternoon
               : h >= 17 && h < 21 ? VIBES.evening
               : VIBES.night;
  return bucket[ts % bucket.length];
}

// ═══════════════════════════════════════════════════
//  Location (lazy, cached)
// ═══════════════════════════════════════════════════
const locCache = {}; // keyed by "lat,lon" — clears on reload
let pendingCoords = null;

function fetchLocation() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    pos => { pendingCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude }; },
    () => {},
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 10000 }
  );
}

async function reverseGeocode(lat, lon) {
  const key = `${lat.toFixed(4)},${lon.toFixed(4)}`;
  if (locCache[key]) return locCache[key];
  try {
    const r = await fetch(
      `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=14&addressdetails=1`,
      { headers: { 'Accept-Language': 'en', 'User-Agent': 'AudioJournalApp/1.0' } }
    );
    const j = await r.json();
    const a = j.address || {};
    // suburb gives the district-level name (e.g. "Bethnal Green") in London and most cities.
    // neighbourhood is often a smaller sub-area that can bleed across district boundaries.
    const area = a.suburb || a.quarter || a.city_district || a.neighbourhood || a.hamlet || a.village;
    const city = a.city || a.town || a.municipality || a.county;
    const post = a.postcode || '';
    const base = area && city ? `${area}, ${city}` : area || city || a.state_district || a.state || 'Unknown location';
    const name = post ? `${base} · ${post}` : base;
    locCache[key] = name;
    return name;
  } catch { return null; }
}

function showTab(tab) {

}

//  RECORD — hold the orb
// ═══════════════════════════════════════════════════
const MAX_SEC  = 30;
const ARC_CIRC = 942; // 2π × 150

function getSupportedMimeType() {
  const candidates = [
    'audio/webm;codecs=opus',
    'audio/webm',
    'audio/ogg;codecs=opus',
    'audio/mp4;codecs=aac',
    'audio/mp4',
  ];
  if (typeof MediaRecorder === 'undefined') return '';
  return candidates.find(t => MediaRecorder.isTypeSupported(t)) || '';
}

let mediaRecorder = null;
let recChunks     = [];
let recInterval   = null;
let recSec        = 0;
let isRecording   = false;

const orbWrap  = document.getElementById('orbWrap');
const orbText  = document.getElementById('orbText');
const orbSub   = document.getElementById('orbSub');
const recTimer = document.getElementById('recTimer');
const arcFill  = document.getElementById('arcFill');

document.getElementById('recDate').textContent = new Date().toLocaleDateString('en-US', {
  weekday:'long', month:'long', day:'numeric'
});

// Warm up location so it's ready when recording starts
fetchLocation();

// The orb is the hold button
orbWrap.addEventListener('pointerdown', async e => {
  orbWrap.setPointerCapture(e.pointerId);
  if (!isRecording) await startRecording();
});
orbWrap.addEventListener('pointerup',     () => { if (isRecording) stopRecording(); });
orbWrap.addEventListener('pointercancel', () => { if (isRecording) stopRecording(); });

async function startRecording() {
  try {
    fetchLocation(); // refresh coords at the moment recording starts
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recChunks = [];
    const mimeType = getSupportedMimeType();
    mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };
    mediaRecorder.onstop = saveClip;
    mediaRecorder.start(100);
    isRecording = true;

    orbWrap.classList.add('held');
    orbText.textContent  = 'listening…';
    orbSub.textContent   = '';
    recTimer.classList.add('visible');
    recSec = 0; recTimer.textContent = `${MAX_SEC}`;
    arcFill.style.strokeDashoffset = 0; // start full

    const countdown = document.getElementById('orbCountdown');
    countdown.textContent = `${MAX_SEC}s`;
    countdown.className   = 'orb-countdown ticking';

    recInterval = setInterval(() => {
      recSec++;
      const remaining = MAX_SEC - recSec;
      recTimer.textContent = `${remaining}`;
      arcFill.style.strokeDashoffset = (recSec / MAX_SEC) * ARC_CIRC; // drain
      countdown.textContent = `${remaining}s`;
      countdown.className   = `orb-countdown ticking${remaining <= 5 ? ' urgent' : ''}`;
      if (recSec >= MAX_SEC) stopRecording();
    }, 1000);

  } catch(e) {
    alert('Microphone access needed.\n\niPhone: Settings → Safari → Microphone → Allow');
  }
}

function stopRecording() {
  if (!isRecording) return;
  isRecording = false;
  clearInterval(recInterval);
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach(t => t.stop());
  }
  orbWrap.classList.remove('held');
  orbText.textContent  = 'speak';
  orbSub.textContent   = 'hold to record';
  recTimer.classList.remove('visible');
  arcFill.style.strokeDashoffset = ARC_CIRC;
  const countdown = document.getElementById('orbCountdown');
  countdown.textContent = '30s';
  countdown.className   = 'orb-countdown';
}

async function saveClip() {
  const blob = new Blob(recChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
  const buf  = await blob.arrayBuffer();
  const loc  = pendingCoords ? { ...pendingCoords } : null;
  await dbAdd({ dateKey: todayKey(), ts: Date.now(), dur: recSec, mime: blob.type, data: buf, loc });
  orbText.textContent = 'saved ✓';
  orbSub.textContent  = '';
  flyToTab(orbWrap, 'tab-clips');
  setTimeout(() => { orbText.textContent = 'speak'; orbSub.textContent = 'hold to record'; }, 1800);
  fetchLocation();
}

function flyToTab(fromEl, targetTabId = 'tab-clips', onDone = null) {
  const fromRect = fromEl.getBoundingClientRect();
  const tabEl    = document.getElementById(targetTabId);
  const tabRect  = tabEl.getBoundingClientRect();
  const orbRect  = fromRect; // alias for readability below

  const sx = orbRect.left + orbRect.width  / 2;
  const sy = orbRect.top  + orbRect.height / 2;
  const ex = tabRect.left + tabRect.width  / 2;
  const ey = tabRect.top  + tabRect.height / 2;

  // ── 1. Burst rings expanding from orb center ──
  for (let i = 0; i < 4; i++) {
    const size = 18;
    const ring = document.createElement('div');
    ring.className = 'fly-burst-ring';
    ring.style.width  = `${size}px`;
    ring.style.height = `${size}px`;
    ring.style.left   = `${sx - size / 2}px`;
    ring.style.top    = `${sy - size / 2}px`;
    document.body.appendChild(ring);
    ring.animate([
      { transform: 'scale(1)',   opacity: 0.9, offset: 0 },
      { transform: 'scale(6.5)', opacity: 0,   offset: 1 },
    ], { duration: 900, delay: i * 120, easing: 'ease-out', fill: 'forwards' });
    setTimeout(() => ring.remove(), 900 + i * 120);
  }

  // ── 2. Main glowing dot flies on a curved arc ──
  const dotSize = 16;
  const dot = document.createElement('div');
  dot.className = 'fly-particle';
  dot.style.width      = `${dotSize}px`;
  dot.style.height     = `${dotSize}px`;
  dot.style.background = 'var(--accent)';
  dot.style.boxShadow  = `0 0 18px var(--accent), 0 0 40px rgba(168,200,255,0.6)`;
  dot.style.left = `${sx - dotSize / 2}px`;
  dot.style.top  = `${sy - dotSize / 2}px`;
  document.body.appendChild(dot);

  // Curved midpoint: arc upward then sweeping down
  const mx = sx + (ex - sx) * 0.35;
  const my = Math.min(sy, ey) - 100;

  dot.animate([
    { left: `${sx - dotSize/2}px`, top: `${sy - dotSize/2}px`, transform: 'scale(1.8)', opacity: 1,   filter: 'blur(0px)',  offset: 0    },
    { left: `${mx - dotSize/2}px`, top: `${my - dotSize/2}px`, transform: 'scale(1.2)', opacity: 1,   filter: 'blur(3px)',  offset: 0.45 },
    { left: `${ex - dotSize/2}px`, top: `${ey - dotSize/2}px`, transform: 'scale(0.2)', opacity: 0,   filter: 'blur(6px)',  offset: 1    },
  ], { duration: 1400, easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)', fill: 'forwards' });

  // ── 3. Trailing particles ──
  for (let i = 0; i < 5; i++) {
    const t     = document.createElement('div');
    const tSize = 6 - i;
    const frac  = 0.1 + i * 0.15;
    const tx    = sx + (ex - sx) * frac + (Math.random() - 0.5) * 20;
    const ty    = sy + (ey - sy) * frac - 40 + (Math.random() - 0.5) * 20;
    t.className     = 'fly-particle';
    t.style.width   = `${tSize}px`;
    t.style.height  = `${tSize}px`;
    t.style.background = 'var(--accent)';
    t.style.left    = `${sx - tSize/2}px`;
    t.style.top     = `${sy - tSize/2}px`;
    t.style.opacity = '0';
    document.body.appendChild(t);
    t.animate([
      { left:`${sx-tSize/2}px`, top:`${sy-tSize/2}px`, opacity:0,   offset:0         },
      { left:`${tx-tSize/2}px`, top:`${ty-tSize/2}px`, opacity:0.8, offset:0.4        },
      { left:`${tx-tSize/2}px`, top:`${ty+30-tSize/2}px`, opacity:0, offset:1          },
    ], { duration: 1000, delay: 100 + i * 60, easing: 'ease-out', fill: 'forwards' });
    setTimeout(() => t.remove(), 1200 + i * 60);
  }

  setTimeout(() => { dot.remove(); if (onDone) onDone(); }, 1500);
}

let playingClipAudio = null;

let todayStitchedAudio = null;

async function renderClips() {
  const all   = await dbAll();
  const clips = all.filter(c => c.dateKey === todayKey()).sort((a,b) => b.ts - a.ts);
  const list  = document.getElementById('clipsList');
  document.getElementById('clipsCount').textContent = `Today · ${clips.length} clip${clips.length !== 1 ? 's' : ''}`;
  list.innerHTML = '';

  // Reset stitch UI
  const stitchRow    = document.getElementById('stitchRow');
  const stitchBtn    = document.getElementById('stitchActionBtn');
  const stitchPlayer = document.getElementById('stitchMiniPlayer');
  if (todayStitchedAudio) { todayStitchedAudio.pause(); todayStitchedAudio = null; }
  stitchPlayer.style.display = 'none';
  stitchBtn.textContent      = 'Stitch today';
  stitchBtn.disabled         = false;
  stitchRow.style.display    = clips.length ? 'flex' : 'none';

  stitchBtn.onclick = async () => {
    stitchBtn.disabled   = true;
    stitchBtn.textContent = 'Stitching…';
    try {
      const blob = await stitchClips(clips);
      const url  = URL.createObjectURL(blob);
      todayStitchedAudio = new Audio(url);
      const playBtn = document.getElementById('stitchMiniPlay');
      const durEl   = document.getElementById('stitchMiniDur');
      let playing   = false;

      todayStitchedAudio.onloadedmetadata = () => {
        durEl.textContent = fmt(todayStitchedAudio.duration);
      };
      todayStitchedAudio.onended = () => { playing = false; playBtn.textContent = '▶ Play'; };
      playBtn.onclick = () => {
        if (playing) { todayStitchedAudio.pause(); playing = false; playBtn.textContent = '▶ Play'; }
        else         { todayStitchedAudio.play();  playing = true;  playBtn.textContent = '⏸ Pause'; }
      };

      stitchBtn.textContent      = 'Stitched ✓';
      stitchPlayer.style.display = 'flex';

      // Fly to Journal tab then navigate there
      flyToTab(stitchBtn, 'tab-journal', () => showTab('journal'));
    } catch { stitchBtn.textContent = 'Failed'; stitchBtn.disabled = false; }
  };

  if (!clips.length) {
    list.innerHTML = '<div class="empty-state">No clips today.<br>Hold the orb to record.</div>';
    return;
  }

  for (const clip of clips) {
    const card = buildClipCard(clip);
    list.appendChild(card);
  }
}

function buildClipCard(clip) {
  const card = document.createElement('div');
  card.className = 'clip-card';

  const d   = new Date(clip.ts);
  const when = d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' })
             + ' · ' + d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
  const vibe = vibeFor(clip.ts);

  card.innerHTML = `
    <div class="clip-card-top">
      <div class="clip-meta">
        <div class="clip-when">${when}</div>
        <div class="clip-where" id="loc-${clip.id}">
          <div class="clip-where-dot"></div>
          <span>${clip.loc ? 'Locating…' : 'Location unavailable'}</span>
        </div>
      </div>
      <button class="clip-del-btn" data-id="${clip.id}">×</button>
    </div>
    <div class="clip-vibe">${vibe}</div>
    <div class="mini-player">
      <button class="mini-play" id="mplay-${clip.id}">▶</button>
      <div class="mini-prog-wrap">
        <div class="mini-prog-bar" id="mbar-${clip.id}">
          <div class="mini-prog-fill" id="mfill-${clip.id}"></div>
        </div>
        <div class="mini-dur">${fmt(clip.dur)}</div>
      </div>
    </div>`;

  // Delete
  card.querySelector('.clip-del-btn').addEventListener('click', async () => {
    if (!confirm('Delete this clip?')) return;
    await dbDelete(clip.id);
    renderClips();
  });

  // Play
  const blob = new Blob([clip.data], { type: clip.mime || 'audio/webm' });
  const url  = URL.createObjectURL(blob);
  const audio = new Audio(url);
  let playing = false;
  const playBtn = card.querySelector(`#mplay-${clip.id}`);
  const fill    = card.querySelector(`#mfill-${clip.id}`);
  const bar     = card.querySelector(`#mbar-${clip.id}`);

  playBtn.addEventListener('click', () => {
    if (playingClipAudio && playingClipAudio !== audio) { playingClipAudio.pause(); }
    playing ? audio.pause() : audio.play();
  });
  audio.addEventListener('play',  () => { playing = true;  playBtn.textContent = '⏸'; playingClipAudio = audio; });
  audio.addEventListener('pause', () => { playing = false; playBtn.textContent = '▶'; });
  audio.addEventListener('ended', () => { playing = false; playBtn.textContent = '▶'; fill.style.width = '0%'; });
  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    fill.style.width = (audio.currentTime / audio.duration * 100) + '%';
  });
  bar.addEventListener('click', e => {
    if (!audio.duration) return;
    const r = bar.getBoundingClientRect();
    audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
  });

  // Resolve location async
  if (clip.loc) {
    const locEl = card.querySelector(`#loc-${clip.id} span`);
    reverseGeocode(clip.loc.lat, clip.loc.lon).then(name => {
      if (name && locEl) locEl.textContent = name;
      else if (locEl) locEl.textContent = `${clip.loc.lat.toFixed(2)}°, ${clip.loc.lon.toFixed(2)}°`;
    });
  }

  return card;
}


// ═══════════════════════════════════════════════════
//  JOURNAL — Calendar
// ═══════════════════════════════════════════════════
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
let calYear = new Date().getFullYear(), calMonth = new Date().getMonth();

async function renderCalendar() {
  const all      = await dbAll();
  const hasDates = new Set(all.map(c => c.dateKey));
  const today    = new Date();
  const scroll   = document.getElementById('calScroll');
  scroll.innerHTML = '';

  // Show 3 months: calMonth-1, calMonth, calMonth+1
  for (let offset = -1; offset <= 1; offset++) {
    let m = calMonth + offset, y = calYear;
    if (m < 0)  { m = 11; y--; }
    if (m > 11) { m = 0;  y++; }

    const block = document.createElement('div');
    block.className = 'cal-month-block';

    // Month label
    const lbl = document.createElement('div');
    lbl.className   = 'cal-month-label';
    lbl.textContent = `${MONTHS[m].slice(0,3).toUpperCase()} ${y}`;
    if (offset === 0) document.getElementById('monthLabel').textContent = lbl.textContent;
    block.appendChild(lbl);

    // Weekday headers
    const wk = document.createElement('div');
    wk.className = 'weekdays';
    ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(d => {
      const s = document.createElement('span'); s.textContent = d; wk.appendChild(s);
    });
    block.appendChild(wk);

    // Day grid
    const grid     = document.createElement('div');
    grid.className = 'cal-grid';
    const firstDay  = new Date(y, m, 1).getDay();
    const daysInMon = new Date(y, m+1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      const el = document.createElement('div'); el.className = 'cal-day empty'; grid.appendChild(el);
    }
    for (let d = 1; d <= daysInMon; d++) {
      const key = dateKeyFor(y, m, d);
      const el  = document.createElement('div');
      el.className = 'cal-day';
      if (d === today.getDate() && m === today.getMonth() && y === today.getFullYear()) el.classList.add('today');
      const num = document.createElement('div'); num.className = 'day-num'; num.textContent = d; el.appendChild(num);
      if (hasDates.has(key)) {
        el.classList.add('has-entry');
        const dot = document.createElement('div'); dot.className = 'entry-dot'; el.appendChild(dot);
      }
      el.addEventListener('click', () => openDay(key));
      grid.appendChild(el);
    }

    block.appendChild(grid);
    scroll.appendChild(block);
  }
}

document.getElementById('prevMonth').addEventListener('click', () => { calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendar(); });
document.getElementById('nextMonth').addEventListener('click', () => { calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendar(); });

// ═══════════════════════════════════════════════════
let stitchedAudio = null;
function stopDayAudio() { if(stitchedAudio){ stitchedAudio.pause(); stitchedAudio=null; } }

async function openDay(key) {
  stopDayAudio();
  const [y,m,d] = key.split('-');
  const dateObj = new Date(parseInt(y), parseInt(m)-1, parseInt(d));
  document.getElementById('dayHeading').textContent = dateObj.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  document.getElementById('daySub').textContent = y;
  showTab('day');

  const scroll = document.getElementById('dayScroll');
  scroll.innerHTML = '<div class="empty-state">Loading…</div>';
  const clips = await dbByDate(key);
  scroll.innerHTML = '';

  if (!clips.length) {
    scroll.innerHTML = '<div class="empty-state">No recordings for this day.</div>';
    return;
  }
  scroll.appendChild(buildDayStitchCard(clips));
  if (clips.length > 1) scroll.appendChild(buildDayClipList(clips, key));
}

function buildDayStitchCard(clips) {
  const totalDur = clips.reduce((s,c) => s+(c.dur||0), 0);
  const card = document.createElement('div');
  card.className = 'stitch-card';
  card.innerHTML = `
    <div class="stitch-label">${clips.length} clip${clips.length>1?'s':''} auto-stitched · ${fmt(totalDur)}</div>
    <div class="stitch-player">
      <button class="big-play-btn" id="stitchPlay" disabled>▶</button>
      <div class="progress-col">
        <div class="prog-bar" id="stitchBar"><div class="prog-fill" id="stitchFill"></div></div>
        <div class="prog-times"><span id="stitchCur">0:00</span><span id="stitchTot">${fmt(totalDur)}</span></div>
      </div>
    </div>
    <div class="stitch-status" id="stitchStatus">Stitching…</div>`;

  stitchClips(clips).then(blob => {
    const url = URL.createObjectURL(blob);
    stitchedAudio = new Audio(url);
    const btn  = document.getElementById('stitchPlay');
    const fill = document.getElementById('stitchFill');
    const cur  = document.getElementById('stitchCur');
    const tot  = document.getElementById('stitchTot');
    const bar  = document.getElementById('stitchBar');
    const stat = document.getElementById('stitchStatus');
    if (!btn) return;
    btn.disabled = false; stat.textContent = 'Ready';
    let playing = false;
    btn.addEventListener('click', () => playing ? stitchedAudio.pause() : stitchedAudio.play());
    stitchedAudio.addEventListener('play',  () => { playing=true;  btn.textContent='⏸'; stat.textContent='Playing'; });
    stitchedAudio.addEventListener('pause', () => { playing=false; btn.textContent='▶'; stat.textContent='Paused'; });
    stitchedAudio.addEventListener('ended', () => { playing=false; btn.textContent='▶'; fill.style.width='0%'; cur.textContent='0:00'; stat.textContent='Done'; });
    stitchedAudio.addEventListener('timeupdate', () => {
      if (!stitchedAudio.duration) return;
      fill.style.width = (stitchedAudio.currentTime/stitchedAudio.duration*100)+'%';
      cur.textContent  = fmt(stitchedAudio.currentTime);
      tot.textContent  = fmt(stitchedAudio.duration);
    });
    bar.addEventListener('click', e => {
      if (!stitchedAudio.duration) return;
      const r = bar.getBoundingClientRect();
      stitchedAudio.currentTime = ((e.clientX - r.left) / r.width) * stitchedAudio.duration;
    });
  }).catch(() => { const s=document.getElementById('stitchStatus'); if(s) s.textContent='Could not stitch.'; });

  return card;
}

function buildDayClipList(clips, dayKey) {
  const wrap = document.createElement('div');
  const lbl = document.createElement('div'); lbl.className='clips-section-label'; lbl.textContent='Individual clips'; wrap.appendChild(lbl);
  [...clips].sort((a,b)=>a.ts-b.ts).forEach(clip => {
    const row=document.createElement('div'); row.className='clip-item';
    const t=new Date(clip.ts);
    row.innerHTML=`
      <div class="clip-icon">🎙</div>
      <div class="clip-info">
        <div class="clip-time">${t.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</div>
        <div class="clip-dur">${fmt(clip.dur)}</div>
      </div>
      <button class="clip-del" data-id="${clip.id}">×</button>`;
    row.querySelector('.clip-del').addEventListener('click', async () => {
      if (!confirm('Delete?')) return;
      await dbDelete(clip.id); openDay(dayKey);
    });
    wrap.appendChild(row);
  });
  return wrap;
}

// ═══════════════════════════════════════════════════
//  Audio stitching
// ═══════════════════════════════════════════════════
async function stitchClips(clips) {
  clips = [...clips].sort((a,b) => a.ts - b.ts);
  const ctx     = new (window.AudioContext || window.webkitAudioContext)();
  const buffers = [];
  for (const c of clips) {
    try {
      const buf = await ctx.decodeAudioData(c.data.slice(0));
      buffers.push(buf);
    } catch (e) {
      console.warn('Could not decode clip', c.id, c.mime, e);
    }
  }
  if (!buffers.length) throw new Error('No clips could be decoded');
  const sr      = buffers[0].sampleRate;
  const ch      = Math.max(...buffers.map(b => b.numberOfChannels));
  const maxSamp = 60 * sr; // hard cap at 60 seconds

  // accumulate until we hit the cap
  let totalLen = 0;
  const used = [];
  for (const buf of buffers) {
    if (totalLen >= maxSamp) break;
    const take = Math.min(buf.length, maxSamp - totalLen);
    used.push({ buf, take });
    totalLen += take;
  }

  const out = ctx.createBuffer(ch, totalLen, sr);
  let off = 0;
  for (const { buf, take } of used) {
    for (let c = 0; c < ch; c++) {
      const src  = c < buf.numberOfChannels ? buf.getChannelData(c) : new Float32Array(buf.length);
      out.getChannelData(c).set(src.subarray(0, take), off);
    }
    off += take;
  }
  ctx.close();
  return audioBufferToWav(out);
}

function audioBufferToWav(buf) {
  const nc=buf.numberOfChannels, sr=buf.sampleRate, len=buf.length, bps=2;
  const dl=len*nc*bps, ab=new ArrayBuffer(44+dl), v=new DataView(ab);
  const s=(o,str)=>[...str].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  s(0,'RIFF'); v.setUint32(4,36+dl,true); s(8,'WAVE'); s(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,nc,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*nc*bps,true);
  v.setUint16(32,nc*bps,true); v.setUint16(34,16,true);
  s(36,'data'); v.setUint32(40,dl,true);
  let off=44;
  for (let i=0;i<len;i++) for (let c=0;c<nc;c++) {
    const x=Math.max(-1,Math.min(1,buf.getChannelData(c)[i]));
    v.setInt16(off, x<0?x*0x8000:x*0x7FFF, true); off+=2;
  }
  return new Blob([ab], {type:'audio/wav'});
}

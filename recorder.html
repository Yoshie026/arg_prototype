<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio Studio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #1a1a1a;
      --surface2: #242424;
      --border: rgba(255,255,255,0.08);
      --accent: #e84040;
      --accent-dim: rgba(232,64,64,0.15);
      --green: #3ecf8e;
      --green-dim: rgba(62,207,142,0.15);
      --text: #f0f0f0;
      --muted: #777;
      --radius: 14px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* ── TABS ── */
    .tab-bar {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .tab-bar button {
      flex: 1;
      background: none;
      border: none;
      color: var(--muted);
      padding: 16px 8px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab-bar button.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    .tab-panel { display: none; flex: 1; flex-direction: column; padding: 24px 20px; }
    .tab-panel.active { display: flex; }

    /* ── RECORD TAB ── */
    .record-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      flex: 1;
      justify-content: center;
    }

    .record-btn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 0 rgba(232,64,64,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      flex-shrink: 0;
    }
    .record-btn.recording {
      animation: pulse 1.2s ease-in-out infinite;
    }
    .record-btn:active { transform: scale(0.94); }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(232,64,64,0.5); }
      70%  { box-shadow: 0 0 0 24px rgba(232,64,64,0); }
      100% { box-shadow: 0 0 0 0 rgba(232,64,64,0); }
    }

    .record-icon {
      width: 36px;
      height: 36px;
      background: #fff;
      border-radius: 50%;
      transition: border-radius 0.2s;
    }
    .recording .record-icon {
      border-radius: 6px;
      width: 30px;
      height: 30px;
    }

    .timer {
      font-size: 3rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .record-label {
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── WAVEFORM ── */
    .waveform-wrap {
      width: 100%;
      max-width: 400px;
      height: 72px;
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
    }
    #waveCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── CLIPS TAB ── */
    .section-title {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 14px;
      font-weight: 600;
    }

    .clips-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .clip-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: default;
    }
    .clip-item.playing {
      border-color: var(--green);
      background: var(--green-dim);
    }
    .clip-item.selected-for-compile {
      border-color: rgba(79, 142, 247, 0.6);
      background: rgba(79, 142, 247, 0.08);
    }

    .clip-info { flex: 1; min-width: 0; }
    .clip-name {
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: text;
    }
    .clip-name:focus { outline: none; border-bottom: 1px solid var(--accent); }
    .clip-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 3px;
    }

    .clip-actions { display: flex; gap: 8px; align-items: center; }
    .icon-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background 0.15s;
    }
    .icon-btn:hover { color: var(--text); background: var(--surface2); }
    .icon-btn.danger:hover { color: var(--accent); }
    .icon-btn.play-btn.active { color: var(--green); }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
    }
    .empty-state svg { opacity: 0.3; }
    .empty-state p { font-size: 0.9rem; }

    /* ── COMPILE TAB ── */
    .compile-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .compile-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .compile-item.dragging { opacity: 0.4; }
    .compile-item.drag-over { border-color: var(--accent); }

    .drag-handle {
      color: var(--muted);
      cursor: grab;
      touch-action: none;
      display: flex;
      padding: 4px 2px;
    }
    .drag-handle:active { cursor: grabbing; }

    .compile-order {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      flex-shrink: 0;
    }

    .compile-name { flex: 1; font-size: 0.88rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .compile-dur { font-size: 0.75rem; color: var(--muted); flex-shrink: 0; }

    .remove-compile {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      display: flex;
    }
    .remove-compile:hover { color: var(--accent); }

    .compile-footer {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .add-clips-btn {
      background: var(--surface);
      border: 1px dashed rgba(255,255,255,0.15);
      border-radius: var(--radius);
      color: var(--muted);
      padding: 14px;
      cursor: pointer;
      font-size: 0.85rem;
      width: 100%;
      text-align: center;
      transition: border-color 0.2s, color 0.2s;
    }
    .add-clips-btn:hover { border-color: var(--accent); color: var(--text); }

    .stitch-btn {
      background: var(--green);
      border: none;
      border-radius: var(--radius);
      color: #0d0d0d;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 16px;
      cursor: pointer;
      width: 100%;
      letter-spacing: 0.02em;
      transition: opacity 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .stitch-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .stitch-btn:not(:disabled):active { transform: scale(0.98); }

    /* ── PICKER MODAL ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      padding: 20px;
      width: 100%;
      max-width: 520px;
      max-height: 70vh;
      overflow-y: auto;
      transform: translateY(20px);
      transition: transform 0.2s;
    }
    .modal-overlay.open .modal { transform: translateY(0); }

    .modal-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .picker-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .picker-item:hover { background: var(--surface2); }
    .picker-item input[type=checkbox] { accent-color: var(--accent); width: 18px; height: 18px; cursor: pointer; }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .modal-actions button {
      flex: 1;
      padding: 13px;
      border-radius: var(--radius);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }
    .btn-cancel { background: var(--surface2); color: var(--muted); }
    .btn-add { background: var(--accent); color: #fff; }

    /* ── PROGRESS BAR ── */
    .progress-wrap {
      margin-top: 10px;
      display: none;
    }
    .progress-wrap.show { display: block; }
    .progress-label { font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; }
    .progress-bar-bg {
      height: 6px;
      background: var(--surface2);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--green);
      border-radius: 3px;
      width: 0%;
      transition: width 0.1s;
    }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 100px;
      font-size: 0.85rem;
      font-weight: 500;
      z-index: 300;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: rgba(62,207,142,0.4); color: var(--green); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 2px; }
  </style>
</head>
<body>

<div class="tab-bar">
  <button class="active" onclick="switchTab('record')">&#9654; Record</button>
  <button onclick="switchTab('clips')">Clips <span id="clipCount"></span></button>
  <button onclick="switchTab('compile')">Compile</button>
</div>

<!-- RECORD -->
<div class="tab-panel active" id="tab-record">
  <div class="record-area">
    <div class="waveform-wrap">
      <canvas id="waveCanvas"></canvas>
    </div>
    <div class="timer" id="timer">0:00.0</div>
    <button class="record-btn" id="recordBtn" onclick="toggleRecord()">
      <div class="record-icon"></div>
    </button>
    <div class="record-label" id="recordLabel">Tap to Record</div>
  </div>
</div>

<!-- CLIPS -->
<div class="tab-panel" id="tab-clips">
  <div class="section-title">Recorded Clips</div>
  <div class="clips-list" id="clipsList"></div>
</div>

<!-- COMPILE -->
<div class="tab-panel" id="tab-compile">
  <div class="section-title">Compilation Order</div>
  <div class="compile-list" id="compileList"></div>
  <div class="compile-footer">
    <button class="add-clips-btn" onclick="openPicker()">+ Add Clips</button>
    <button class="stitch-btn" id="stitchBtn" onclick="stitchClips()" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
      Stitch &amp; Download
    </button>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-label" id="progressLabel">Processing...</div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
    </div>
  </div>
</div>

<!-- PICKER MODAL -->
<div class="modal-overlay" id="pickerOverlay" onclick="closePicker(event)">
  <div class="modal">
    <div class="modal-title">Add clips to compilation</div>
    <div id="pickerList"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closePicker()">Cancel</button>
      <button class="btn-add" onclick="confirmAddClips()">Add Selected</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ────────────────────────────────────────────────────────────
// STATE
// ────────────────────────────────────────────────────────────
let clips = [];          // { id, name, blob, duration, url }
let compileQueue = [];   // clip ids in order

let mediaRecorder = null;
let recordChunks = [];
let recordStart = 0;
let timerInterval = null;
let analyserNode = null;
let animFrameId = null;
let audioCtx = null;
let activeAudio = null; // currently playing HTMLAudioElement
let activeClipId = null;
let dragSrcIdx = null;

// ────────────────────────────────────────────────────────────
// TABS
// ────────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  event.currentTarget.classList.add('active');
  if (name === 'clips') renderClips();
  if (name === 'compile') renderCompile();
}

// ────────────────────────────────────────────────────────────
// RECORDING
// ────────────────────────────────────────────────────────────
async function toggleRecord() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    stopRecording();
  } else {
    await startRecording();
  }
}

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    analyserNode = audioCtx.createAnalyser();
    analyserNode.fftSize = 256;
    source.connect(analyserNode);

    const opts = getSupportedMimeType();
    mediaRecorder = new MediaRecorder(stream, opts ? { mimeType: opts } : {});
    recordChunks = [];

    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordChunks.push(e.data); };
    mediaRecorder.onstop = finalizeRecording;

    mediaRecorder.start(100);
    recordStart = Date.now();

    document.getElementById('recordBtn').classList.add('recording');
    document.getElementById('recordLabel').textContent = 'Recording — tap to stop';
    startTimer();
    drawWaveform();
  } catch (err) {
    showToast('Microphone access denied');
    console.error(err);
  }
}

function getSupportedMimeType() {
  const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'];
  return types.find(t => MediaRecorder.isTypeSupported(t)) || '';
}

function stopRecording() {
  if (mediaRecorder) {
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach(t => t.stop());
  }
  clearInterval(timerInterval);
  cancelAnimationFrame(animFrameId);
  document.getElementById('recordBtn').classList.remove('recording');
  document.getElementById('recordLabel').textContent = 'Tap to Record';
  document.getElementById('timer').textContent = '0:00.0';
  clearWaveform();
}

function finalizeRecording() {
  const mimeType = mediaRecorder.mimeType || 'audio/webm';
  const blob = new Blob(recordChunks, { type: mimeType });
  const duration = (Date.now() - recordStart) / 1000;
  const url = URL.createObjectURL(blob);
  const id = 'clip_' + Date.now();
  const name = 'Clip ' + (clips.length + 1);
  clips.push({ id, name, blob, duration, url, mimeType });
  updateClipCount();
  showToast('Clip saved: ' + name, true);
}

// ────────────────────────────────────────────────────────────
// TIMER
// ────────────────────────────────────────────────────────────
function startTimer() {
  const el = document.getElementById('timer');
  timerInterval = setInterval(() => {
    const elapsed = (Date.now() - recordStart) / 1000;
    const m = Math.floor(elapsed / 60);
    const s = Math.floor(elapsed % 60).toString().padStart(2, '0');
    const ds = Math.floor((elapsed % 1) * 10);
    el.textContent = `${m}:${s}.${ds}`;
  }, 100);
}

// ────────────────────────────────────────────────────────────
// WAVEFORM VISUALIZER
// ────────────────────────────────────────────────────────────
const canvas = document.getElementById('waveCanvas');
const ctx2d = canvas.getContext('2d');

function drawWaveform() {
  const wrap = canvas.parentElement;
  canvas.width = wrap.clientWidth * devicePixelRatio;
  canvas.height = wrap.clientHeight * devicePixelRatio;

  const dataArr = new Uint8Array(analyserNode.frequencyBinCount);

  function draw() {
    animFrameId = requestAnimationFrame(draw);
    analyserNode.getByteTimeDomainData(dataArr);

    ctx2d.clearRect(0, 0, canvas.width, canvas.height);
    ctx2d.lineWidth = 2 * devicePixelRatio;
    ctx2d.strokeStyle = '#e84040';
    ctx2d.beginPath();

    const sliceWidth = canvas.width / dataArr.length;
    let x = 0;
    for (let i = 0; i < dataArr.length; i++) {
      const v = dataArr[i] / 128.0;
      const y = (v * canvas.height) / 2;
      i === 0 ? ctx2d.moveTo(x, y) : ctx2d.lineTo(x, y);
      x += sliceWidth;
    }
    ctx2d.lineTo(canvas.width, canvas.height / 2);
    ctx2d.stroke();
  }
  draw();
}

function clearWaveform() {
  ctx2d.clearRect(0, 0, canvas.width, canvas.height);
}

// ────────────────────────────────────────────────────────────
// CLIPS TAB
// ────────────────────────────────────────────────────────────
function renderClips() {
  const list = document.getElementById('clipsList');
  if (clips.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
        <p>No clips yet — go record something</p>
      </div>`;
    return;
  }
  list.innerHTML = '';
  clips.forEach(clip => {
    const item = document.createElement('div');
    item.className = 'clip-item' + (activeClipId === clip.id ? ' playing' : '');
    item.innerHTML = `
      <div class="clip-info">
        <div class="clip-name" contenteditable="true" spellcheck="false"
             onblur="renameClip('${clip.id}', this.textContent.trim())"
             onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">${escHtml(clip.name)}</div>
        <div class="clip-meta">${fmtDur(clip.duration)}</div>
      </div>
      <div class="clip-actions">
        <button class="icon-btn play-btn${activeClipId === clip.id ? ' active' : ''}" onclick="togglePlay('${clip.id}')" title="Play">
          ${activeClipId === clip.id ? stopIcon() : playIcon()}
        </button>
        <button class="icon-btn danger" onclick="deleteClip('${clip.id}')" title="Delete">
          ${trashIcon()}
        </button>
      </div>`;
    list.appendChild(item);
  });
}

function updateClipCount() {
  const el = document.getElementById('clipCount');
  el.textContent = clips.length ? `(${clips.length})` : '';
}

function togglePlay(id) {
  if (activeAudio) {
    activeAudio.pause();
    activeAudio = null;
    const prev = activeClipId;
    activeClipId = null;
    if (prev === id) { renderClips(); return; }
  }
  const clip = clips.find(c => c.id === id);
  if (!clip) return;
  activeClipId = id;
  const audio = new Audio(clip.url);
  activeAudio = audio;
  audio.play();
  audio.onended = () => { activeAudio = null; activeClipId = null; renderClips(); };
  renderClips();
}

function renameClip(id, newName) {
  if (!newName) return;
  const clip = clips.find(c => c.id === id);
  if (clip) clip.name = newName;
  updateCompileNames();
}

function deleteClip(id) {
  if (activeClipId === id && activeAudio) { activeAudio.pause(); activeAudio = null; activeClipId = null; }
  const idx = clips.findIndex(c => c.id === id);
  if (idx >= 0) { URL.revokeObjectURL(clips[idx].url); clips.splice(idx, 1); }
  compileQueue = compileQueue.filter(qid => qid !== id);
  updateClipCount();
  renderClips();
}

// ────────────────────────────────────────────────────────────
// COMPILE TAB
// ────────────────────────────────────────────────────────────
function renderCompile() {
  const list = document.getElementById('compileList');
  updateStitchBtn();

  if (compileQueue.length === 0) {
    list.innerHTML = `
      <div class="empty-state" style="flex:1;min-height:120px">
        <p>Add clips below to build your compilation</p>
      </div>`;
    return;
  }
  list.innerHTML = '';
  compileQueue.forEach((id, idx) => {
    const clip = clips.find(c => c.id === id);
    if (!clip) return;
    const item = document.createElement('div');
    item.className = 'compile-item';
    item.draggable = true;
    item.dataset.idx = idx;
    item.innerHTML = `
      <div class="drag-handle" title="Drag to reorder">${dragIcon()}</div>
      <div class="compile-order">${idx + 1}</div>
      <div class="compile-name">${escHtml(clip.name)}</div>
      <div class="compile-dur">${fmtDur(clip.duration)}</div>
      <button class="remove-compile" onclick="removeFromCompile(${idx})" title="Remove">${closeIcon()}</button>`;

    item.addEventListener('dragstart', onDragStart);
    item.addEventListener('dragover', onDragOver);
    item.addEventListener('drop', onDrop);
    item.addEventListener('dragend', onDragEnd);
    list.appendChild(item);
  });
}

function updateCompileNames() {
  if (document.getElementById('tab-compile').classList.contains('active')) renderCompile();
}

function removeFromCompile(idx) {
  compileQueue.splice(idx, 1);
  renderCompile();
}

function updateStitchBtn() {
  document.getElementById('stitchBtn').disabled = compileQueue.length < 1;
}

// Drag & drop reorder
function onDragStart(e) {
  dragSrcIdx = +e.currentTarget.dataset.idx;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function onDragOver(e) {
  e.preventDefault();
  document.querySelectorAll('.compile-item').forEach(el => el.classList.remove('drag-over'));
  e.currentTarget.classList.add('drag-over');
}
function onDrop(e) {
  e.preventDefault();
  const targetIdx = +e.currentTarget.dataset.idx;
  if (dragSrcIdx === targetIdx) return;
  const moved = compileQueue.splice(dragSrcIdx, 1)[0];
  compileQueue.splice(targetIdx, 0, moved);
  renderCompile();
}
function onDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.compile-item').forEach(el => el.classList.remove('drag-over'));
}

// ────────────────────────────────────────────────────────────
// PICKER MODAL
// ────────────────────────────────────────────────────────────
function openPicker() {
  const list = document.getElementById('pickerList');
  if (clips.length === 0) { showToast('No clips recorded yet'); return; }
  list.innerHTML = '';
  clips.forEach(clip => {
    const div = document.createElement('div');
    div.className = 'picker-item';
    div.innerHTML = `
      <input type="checkbox" id="pick_${clip.id}" value="${clip.id}" ${compileQueue.includes(clip.id) ? 'checked' : ''}>
      <label for="pick_${clip.id}" style="flex:1;cursor:pointer">
        <div style="font-size:0.88rem;font-weight:500">${escHtml(clip.name)}</div>
        <div style="font-size:0.75rem;color:var(--muted)">${fmtDur(clip.duration)}</div>
      </label>`;
    list.appendChild(div);
  });
  document.getElementById('pickerOverlay').classList.add('open');
}

function closePicker(e) {
  if (!e || e.target === document.getElementById('pickerOverlay'))
    document.getElementById('pickerOverlay').classList.remove('open');
}

function confirmAddClips() {
  const checked = [...document.querySelectorAll('#pickerList input:checked')].map(el => el.value);
  compileQueue = [...new Set([...compileQueue, ...checked])];
  // remove unchecked
  const unchecked = [...document.querySelectorAll('#pickerList input:not(:checked)')].map(el => el.value);
  compileQueue = compileQueue.filter(id => !unchecked.includes(id));
  document.getElementById('pickerOverlay').classList.remove('open');
  renderCompile();
}

// ────────────────────────────────────────────────────────────
// STITCH & EXPORT
// ────────────────────────────────────────────────────────────
async function stitchClips() {
  if (compileQueue.length === 0) return;
  const btn = document.getElementById('stitchBtn');
  btn.disabled = true;
  showProgress('Decoding audio...');

  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buffers = [];

    for (let i = 0; i < compileQueue.length; i++) {
      const id = compileQueue[i];
      const clip = clips.find(c => c.id === id);
      updateProgress(Math.round((i / compileQueue.length) * 50), `Decoding clip ${i + 1} of ${compileQueue.length}...`);
      const arrayBuf = await clip.blob.arrayBuffer();
      const audioBuf = await ctx.decodeAudioData(arrayBuf);
      buffers.push(audioBuf);
    }

    updateProgress(55, 'Stitching clips...');
    const numChannels = Math.max(...buffers.map(b => b.numberOfChannels));
    const sampleRate = buffers[0].sampleRate;
    const totalLength = buffers.reduce((sum, b) => sum + b.length, 0);

    const output = ctx.createBuffer(numChannels, totalLength, sampleRate);
    let offset = 0;
    for (const buf of buffers) {
      for (let ch = 0; ch < numChannels; ch++) {
        const src = ch < buf.numberOfChannels ? buf.getChannelData(ch) : buf.getChannelData(0);
        output.getChannelData(ch).set(src, offset);
      }
      offset += buf.length;
    }

    updateProgress(80, 'Encoding WAV...');
    const wavBlob = encodeWAV(output);

    updateProgress(100, 'Done!');
    await new Promise(r => setTimeout(r, 300));

    const url = URL.createObjectURL(wavBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'compilation_' + Date.now() + '.wav';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);

    showToast('Download started!', true);
  } catch (err) {
    console.error(err);
    showToast('Error stitching clips: ' + err.message);
  } finally {
    hideProgress();
    btn.disabled = compileQueue.length < 1;
  }
}

function encodeWAV(audioBuffer) {
  const numChannels = audioBuffer.numberOfChannels;
  const sampleRate = audioBuffer.sampleRate;
  const numSamples = audioBuffer.length;
  const bytesPerSample = 2; // 16-bit
  const blockAlign = numChannels * bytesPerSample;
  const byteRate = sampleRate * blockAlign;
  const dataSize = numSamples * blockAlign;
  const buf = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buf);

  function str(view, off, s) { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); }
  str(view, 0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  str(view, 8, 'WAVE');
  str(view, 12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true); // PCM
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, byteRate, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, 16, true);
  str(view, 36, 'data');
  view.setUint32(40, dataSize, true);

  let off = 44;
  for (let i = 0; i < numSamples; i++) {
    for (let ch = 0; ch < numChannels; ch++) {
      const s = Math.max(-1, Math.min(1, audioBuffer.getChannelData(ch)[i]));
      view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      off += 2;
    }
  }
  return new Blob([buf], { type: 'audio/wav' });
}

// ────────────────────────────────────────────────────────────
// PROGRESS
// ────────────────────────────────────────────────────────────
function showProgress(label) {
  const wrap = document.getElementById('progressWrap');
  wrap.classList.add('show');
  document.getElementById('progressLabel').textContent = label;
  document.getElementById('progressFill').style.width = '0%';
}
function updateProgress(pct, label) {
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = label;
}
function hideProgress() {
  document.getElementById('progressWrap').classList.remove('show');
}

// ────────────────────────────────────────────────────────────
// TOAST
// ────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, success = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (success ? ' success' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// ────────────────────────────────────────────────────────────
// HELPERS
// ────────────────────────────────────────────────────────────
function fmtDur(s) {
  const m = Math.floor(s / 60);
  const sec = (s % 60).toFixed(1).padStart(4, '0');
  return `${m}:${sec}`;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function playIcon() {
  return `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>`;
}
function stopIcon() {
  return `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`;
}
function trashIcon() {
  return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3,6 5,6 21,6"/><path d="M19,6l-1,14H6L5,6"/><path d="M10,11v6M14,11v6"/><path d="M9,6V4h6v2"/></svg>`;
}
function dragIcon() {
  return `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" opacity="0.5"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg>`;
}
function closeIcon() {
  return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
}
</script>
